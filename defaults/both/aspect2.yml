external_templates:
  default: templates
  template_variables:
    collection_section: "125"

collections:
  Aspect Ratio Collections:
    template:
      - name: separator
        separator: aspect
        key_name: Aspect Ratio
        translation_key: separator

dynamic_collections:
  Aspect:
    type: custom
    data:
      "1.33": Academy Aperture
      "1.65": Early Widescreen
      "1.66": European Widescreen
      "1.78": Widescreen TV
      "1.85": American Widescreen
      "2.2": 70mm Frame
      "2.35": Anamorphic Projection
      "2.77": Cinerama
    title_format: <<key>> - <<key_name>>
    template:
      - filter
      - shared
    template_variables:
      filter_term:
        default: aspect.gt
      filter_term2:
        default: aspect.lt
      filter_value1:
        "1.33": 1.32
        "1.65": 1.64
        "1.66": 1.65
        "1.78": 1.77
        "1.85": 1.84
        "2.2": 2.19
        "2.35": 2.34
        "2.77": 2.76
      filter_value2:
        "1.33": 1.34
        "1.65": 1.66
        "1.66": 1.67
        "1.78": 1.79
        "1.85": 1.86
        "2.2": 2.21
        "2.35": 2.36
        "2.77": 2.78
      image:
        default: aspect/<<key>>
      translation_key:
        default: aspect
      dynamic:
        default: true
